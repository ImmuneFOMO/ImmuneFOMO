name: Profile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.mjs]
  schedule:
    - cron: '0 3 * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY" .
          node profile.test.mjs
          node profile.mjs
          git config user.name ImmuneFOMO
          git config user.email 60671130+ImmuneFOMO@users.noreply.github.com
          git add ascii-*.svg
          git diff --cached --quiet || { git commit -m "chore: update profile stats [skip ci]"; git push; }
